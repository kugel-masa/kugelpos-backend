[pytest]
asyncio_mode = strict
addopts = -v -s
# Use a single event loop for all tests in a module
asyncio_default_fixture_loop_scope = function
markers =
    unit: pure unit tests, no external dependencies (run with: pytest -m unit)
    integration: requires real MongoDB only, other services mocked (run with: pytest -m integration)
    e2e: requires full docker-compose stack with all services running (run with: pytest -m e2e)
    dual_only: drives the cart without carrying its snapshot, so it needs the phase 1
        cache-authoritative fallback and cannot pass under CART_REQUEST_SNAPSHOT_MODE=REQUIRED.
        Runs by default; deselect with -m "not dual_only" against a REQUIRED stack (issue #156)
