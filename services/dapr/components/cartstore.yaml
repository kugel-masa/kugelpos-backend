apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cartstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    value: "mongodb:27017"
  - name: databaseName
    value: "dapr_cartstore"
  - name: collectionName
    value: "cart_cache"
  - name: actorStateStore
    value: "false"
  - name: operationTimeout
    value: "5s"
