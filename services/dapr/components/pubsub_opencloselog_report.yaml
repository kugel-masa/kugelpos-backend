apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-opencloselog-report
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: connectionString
      value: "amqp://rabbitmq:5672"
    - name: durable
      value: "true"
    - name: deletedWhenUnused
      value: "false"
    - name: deliveryMode
      value: "2"
    - name: requeueInFailure
      # "false": once the sidecar's retries (pubsub-resiliency.yaml) run out, the
      # message goes to the dead-letter queue. "true" put it straight back on this
      # queue, so a message that always fails was redelivered forever (#230).
      value: "false"
    - name: prefetchCount
      value: "10"
    - name: publisherConfirm
      value: "true"
    - name: enableDeadLetter
      value: "true"
