x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  account:
    build:
      context: ./account
      dockerfile: Dockerfile
    image: masakugel/kugelpos.account:latest
    logging: *default-logging
    env_file:
      - path: ./account/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_account
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  terminal:
    build:
      context: ./terminal
      dockerfile: Dockerfile
    image: masakugel/kugelpos.terminal:latest
    logging: *default-logging
    env_file:
      - path: ./terminal/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_terminal
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_MASTER_DATA=http://master-data:8000/api/v1
      - BASE_URL_CART=http://cart:8000/api/v1
      - BASE_URL_REPORT=http://report:8000/api/v1
      - BASE_URL_JOURNAL=http://journal:8000/api/v1
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
      - BASE_URL_STOCK=http://stock:8000/api/v1
    ports:
      - "8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  master-data:
    build:
      context: ./master-data
      dockerfile: Dockerfile
    image: masakugel/kugelpos.master-data:latest
    logging: *default-logging
    env_file:
      - path: ./master-data/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_master
      # gRPC server settings (default: disabled)
      - USE_GRPC=${USE_GRPC:-false}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
    ports:
      - "8002:8000"
      - "50051:50051"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    image: masakugel/kugelpos.cart:latest
    logging: *default-logging
    env_file:
      - path: ./cart/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_cart
      # gRPC client settings (default: disabled)
      - USE_GRPC=${USE_GRPC:-false}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT:-5.0}
      - MASTER_DATA_GRPC_URL=${MASTER_DATA_GRPC_URL:-master-data:50051}
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
      - BASE_URL_MASTER_DATA=http://master-data:8000/api/v1
    ports:
      - "8003:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  report:
    build:
      context: ./report
      dockerfile: Dockerfile
    image: masakugel/kugelpos.report:latest
    logging: *default-logging
    env_file:
      - path: ./report/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_report
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
      - BASE_URL_MASTER_DATA=http://master-data:8000/api/v1
      - BASE_URL_CART=http://cart:8000/api/v1
      - BASE_URL_JOURNAL=http://journal:8000/api/v1
    ports:
      - "8004:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  journal:
    build:
      context: ./journal
      dockerfile: Dockerfile
    image: masakugel/kugelpos.journal:latest
    logging: *default-logging
    env_file:
      - path: ./journal/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_journal
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
      - BASE_URL_CART=http://cart:8000/api/v1
    ports:
      - "8005:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  stock:
    build:
      context: ./stock
      dockerfile: Dockerfile
    image: masakugel/kugelpos.stock:latest
    logging: *default-logging
    env_file:
      - path: ./stock/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - DB_NAME_PREFIX=db_stock
      - BASE_URL_DAPR=http://localhost:3500/v1.0
      - TOKEN_URL=http://account:8000/api/v1/accounts/token
      - BASE_URL_TERMINAL=http://terminal:8000/api/v1
      - BASE_URL_MASTER_DATA=http://master-data:8000/api/v1
      - BASE_URL_CART=http://cart:8000/api/v1
    ports:
      - "8006:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kugelpos_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dapr_account:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "account", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      account:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:account"

  dapr_terminal:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "terminal", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      terminal:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:terminal"

  dapr_master_data:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "master-data", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      master-data:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:master-data"

  dapr_cart:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "cart", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      cart:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:cart"
    environment:
      - DAPR_PUBSUB_NAME=pubsub

  dapr_report:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "report", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      report:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:report"

  dapr_journal:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "journal", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      journal:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:journal"

  dapr_stock:
    image: daprio/daprd:latest
    logging: *default-logging
    command: ["./daprd", "-app-id", "stock", "-app-port", "8000", "-dapr-http-port", "3500", "-config", "/dapr/config.yaml", "-components-path", "./dapr/components"]
    depends_on:
      stock:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./dapr/config.yaml:/dapr/config.yaml:ro
      - ./dapr/components:/dapr/components
    network_mode: "service:stock"

  redis:
    image: redis:latest
    container_name: redis
    logging: *default-logging
    ports:
      - "6380:6379"
    networks:
      - kugelpos_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    logging: *default-logging
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kugelpos_net

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    logging: *default-logging
    # WiredTiger holds many file descriptors (one per collection / index).
    # The default container ulimit of 1024 nofile is exhausted quickly
    # during e2e test runs that create per-tenant DBs (each new tenant ≈
    # ~30 file descriptors), causing WT panics ("Too many open files")
    # and crash loops. Raise to 65536 — well within host limits and
    # standard for a real mongod deployment.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "27017:27017"
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ../scripts/mongodb-init.js:/docker-entrypoint-initdb.d/01-init-replica.js:ro
    networks:
      - kugelpos_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  kugelpos_net:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
