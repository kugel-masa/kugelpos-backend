# Logging configuration.
#
# Every value here is a literal and every file handler is bounded, because this
# file has more than one reader: main.py loads it through
# kugel_common.utils.logging_setup.configure_logging, and tests/conftest.py
# calls fileConfig() on it directly. The LOG_* environment overrides are applied
# by configure_logging, not here.
#
# The handlers rotate because a plain FileHandler grows without bound inside the
# container, where no log driver can cap it. They are ConcurrentRotatingFileHandler,
# not the standard RotatingFileHandler, because the UVICORN_WORKERS processes
# each hold a handler on the same files: with the standard one every worker
# rotates on its own, segments are cut short and a rotation can drop a segment
# outright. The concurrent handler is used whatever the worker count, since that
# count is set in more than one place (Dockerfile, compose, the deployment).
# INFO is the default; DEBUG is opt-in through LOG_LEVEL. audit.log keeps a
# longer history and its level is not lowered by LOG_LEVEL, since it is a
# security record.
#
# pymongo and httpcore are raised to WARNING to quiet them. propagate=0 keeps a
# warning that gets through from being written twice, once by their own
# handlers and again by root's.
[loggers]
keys=root, pymongo, requestLogger, httpcore, auditLogger

[handlers]
keys=consoleHandler, fileHandler, requestFileHandler, auditFileHandler

[formatters]
keys=sampleFormatter, requestFormatter, auditFormatter

[logger_root]
level=INFO
handlers=consoleHandler, fileHandler

[logger_requestLogger]
level=INFO
handlers=requestFileHandler
qualname=requestLogger
propagate=0

[logger_pymongo]
level=WARNING
handlers=consoleHandler, fileHandler
qualname=pymongo
propagate=0

[logger_httpcore]
level=WARNING
handlers=consoleHandler, fileHandler
qualname=httpcore
propagate=0

[logger_auditLogger]
level=INFO
handlers=consoleHandler, auditFileHandler
qualname=audit
propagate=0

[handler_consoleHandler]
class=logging.StreamHandler
level=INFO
formatter=sampleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=concurrent_log_handler.ConcurrentRotatingFileHandler
level=INFO
formatter=sampleFormatter
args=('app.log', 'a', 20971520, 5, 'utf-8')

[handler_requestFileHandler]
class=concurrent_log_handler.ConcurrentRotatingFileHandler
level=INFO
formatter=requestFormatter
args=('request.log', 'a', 20971520, 5, 'utf-8')

[handler_auditFileHandler]
class=concurrent_log_handler.ConcurrentRotatingFileHandler
level=INFO
formatter=auditFormatter
args=('audit.log', 'a', 20971520, 20, 'utf-8')

[formatter_sampleFormatter]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=

[formatter_requestFormatter]
format=%(asctime)s : %(message)s

[formatter_auditFormatter]
format=%(asctime)s [%(levelname)s] AUDIT: %(message)s
datefmt=